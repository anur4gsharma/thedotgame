services:
  - type: web
    name: dots-game-server
    env: node
    plan: free
    rootDir: .
    buildCommand: pnpm install --prod=false && pnpm build:server
    startCommand: node packages/server/dist/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
